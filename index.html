<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nudge</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Nudge" />
  <meta property="og:title" content="Nudge" />
  <meta property="og:description" content="A low-friction follow-up tool for your day." />
  <meta property="og:image" content="/og-image.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: '#FBFBFA',
            obsidian: '#111215',
            muted: '#71717A',
            borderWarm: '#E5E5E2',
            cardBg: '#FFFFFF',
            accentLilac: '#8B8DF8',
            accentLilacDeep: '#7371FC',
            accentLilacSoft: '#F3F0FF'
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"Space Mono"', 'monospace']
          },
          borderRadius: { card: '20px' }
        }
      }
    };
  </script>
  <style>
    body { background-color: #FBFBFA; color: #111215; -webkit-tap-highlight-color: transparent; user-select: none; }
    input, textarea, select { user-select: text; }
    .ring-track { stroke: #E5E5E2; }
    .ring-progress { stroke: #8B8DF8; transition: stroke-dashoffset 0.05s linear, stroke 0.2s ease; }
    .active-hold .ring-progress { stroke: #7371FC; }
    .burst { animation: nudgeBurst 0.45s ease-out; }
    @keyframes nudgeBurst {
      0% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(139,141,248,0)); }
      35% { transform: scale(1.22); filter: drop-shadow(0 0 14px rgba(139,141,248,0.65)); }
      100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(139,141,248,0)); }
    }
    .preset-pill { -webkit-tap-highlight-color: transparent; }
    #customPanel { overflow: hidden; max-height: 0; opacity: 0; transition: max-height 0.25s ease, opacity 0.2s ease; }
    #customChevron { transition: transform 0.2s ease; }
  </style>
</head>
<body class="min-h-screen flex justify-center p-4 sm:p-6 antialiased">
  <div class="w-full max-w-md flex flex-col justify-between py-2">
    <header class="mb-5 flex justify-between items-center border-b border-borderWarm pb-4">
      <div class="flex items-center gap-2.5">
        <svg class="w-7 h-7 flex-shrink-0" viewBox="0 0 100 100" fill="none">
          <path d="M50 85 V45 C50 36 41 36 41 45 V85" stroke="#111215" stroke-width="7" stroke-linecap="round"/>
          <ellipse cx="40" cy="56" rx="9" ry="5" transform="rotate(-25 40 56)" stroke="#8B8DF8" stroke-width="4.5"/>
          <ellipse cx="51" cy="56" rx="9" ry="5" transform="rotate(25 51 56)" stroke="#8B8DF8" stroke-width="4.5"/>
          <circle cx="45.5" cy="56" r="3" fill="#8B8DF8"/>
          <path d="M43 59 C40 67 34 71 30 74 M48 59 C51 67 57 71 61 74" stroke="#8B8DF8" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
        <div>
          <p class="font-mono text-[10px] uppercase tracking-widest text-muted">Studio Fondue</p>
          <h1 class="text-xl font-bold tracking-tight text-obsidian -mt-0.5">Nudge</h1>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <div id="taskCount" class="font-mono text-xs font-semibold px-2.5 py-1 bg-obsidian text-canvas rounded-full">0/5 ACTIVE</div>
        <button id="settingsBtn" title="Reminder Settings" class="p-1.5 text-muted hover:text-obsidian active:scale-95 transition-transform">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        </button>
      </div>
    </header>

    <div class="bg-cardBg border border-borderWarm rounded-card p-4 shadow-sm mb-5">
      <div class="flex items-center gap-2 mb-3">
        <input id="taskInput" type="text" placeholder="Dictate or type (e.g. 'Gym in 45 mins')" maxlength="80" class="w-full bg-transparent text-sm font-medium focus:outline-none placeholder:text-muted placeholder:font-normal" />
        <button id="micBtn" type="button" title="Dictate with smart timing" class="p-2 text-muted hover:text-obsidian active:scale-95 transition-transform rounded-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19 10v1a7 7 0 01-14 0v-1M12 18v4M8 22h8"/></svg>
        </button>
      </div>
      <div class="space-y-2.5 pt-3 border-t border-borderWarm/60 text-xs">
        <div class="flex items-center justify-between gap-2">
          <label class="text-muted font-medium">When:</label>
          <input id="dueDateTime" type="datetime-local" class="bg-canvas border border-borderWarm rounded-lg px-2.5 py-1 text-obsidian font-mono text-xs focus:outline-none" />
        </div>
        <div class="flex items-center justify-between gap-2">
          <label class="text-muted font-medium">Early Alert:</label>
          <select id="earlyAlert" class="bg-canvas border border-borderWarm rounded-lg px-2.5 py-1 text-obsidian font-mono text-xs focus:outline-none">
            <option value="0">At time of event</option>
            <option value="5">5 mins before</option>
            <option value="15">15 mins before</option>
            <option value="30">30 mins before</option>
            <option value="60">1 hour before</option>
          </select>
        </div>
        <div class="pt-2 flex justify-end">
          <button id="addBtn" class="bg-obsidian text-canvas font-semibold px-5 py-2 rounded-xl text-xs active:scale-95 transition-transform">Add Task</button>
        </div>
      </div>
    </div>

    <main class="flex-1 space-y-3.5" id="taskList"></main>
    <footer class="mt-8 text-center text-[11px] text-muted font-mono">Tap = check on me later · Hold 5s = sworn done</footer>
  </div>

  <div id="settingsModal" class="fixed inset-0 bg-obsidian/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
    <div class="bg-cardBg border border-borderWarm rounded-card p-6 w-full max-w-sm shadow-xl">
      <h3 class="font-bold text-base text-obsidian mb-1">Nudge Follow-up Intervals</h3>
      <p class="text-xs text-muted mb-5 leading-relaxed">How often should Nudge check in on you today?</p>

      <div class="grid grid-cols-3 gap-2 mb-1">
        <button type="button" data-preset="sprint" class="preset-pill flex flex-col items-center justify-center gap-1.5 py-3 px-1 rounded-xl border-2 bg-canvas border-borderWarm text-obsidian active:scale-95 transition-transform">
          <svg class="preset-icon w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#111215" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 11 14 9 22 21 10 13 10 13 2"/></svg>
          <span class="text-xs font-bold">Sprint</span>
          <span class="font-mono text-[9px] text-muted">15→30→45m</span>
        </button>
        <button type="button" data-preset="standard" class="preset-pill flex flex-col items-center justify-center gap-1.5 py-3 px-1 rounded-xl border-2 bg-canvas border-borderWarm text-obsidian active:scale-95 transition-transform">
          <svg class="preset-icon w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#111215" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          <span class="text-xs font-bold">Standard</span>
          <span class="font-mono text-[9px] text-muted">30→60→120m</span>
        </button>
        <button type="button" data-preset="later" class="preset-pill flex flex-col items-center justify-center gap-1.5 py-3 px-1 rounded-xl border-2 bg-canvas border-borderWarm text-obsidian active:scale-95 transition-transform">
          <svg class="preset-icon w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#111215" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-8-8c0 4 2 8 8 8z"/></svg>
          <span class="text-xs font-bold">Later</span>
          <span class="font-mono text-[9px] text-muted">1h→2h→4h</span>
        </button>
      </div>

      <button id="customToggleBtn" type="button" class="w-full flex items-center justify-center gap-1 py-2.5 text-muted hover:text-obsidian active:scale-95 transition-transform">
        <span class="font-mono text-[11px]">Custom...</span>
        <svg id="customChevron" class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>

      <div id="customPanel">
        <div class="space-y-3 font-mono text-xs mb-1 pt-3 border-t border-borderWarm/60">
          <div class="flex justify-between items-center"><span>First check:</span><div class="flex items-center gap-1"><input id="settingStage1" type="number" min="5" max="180" class="w-16 p-1.5 border border-borderWarm rounded-lg text-center bg-canvas" /><span class="text-muted">mins</span></div></div>
          <div class="flex justify-between items-center"><span>Second check:</span><div class="flex items-center gap-1"><input id="settingStage2" type="number" min="5" max="240" class="w-16 p-1.5 border border-borderWarm rounded-lg text-center bg-canvas" /><span class="text-muted">mins</span></div></div>
          <div class="flex justify-between items-center"><span>Final check:</span><div class="flex items-center gap-1"><input id="settingStage3" type="number" min="5" max="360" class="w-16 p-1.5 border border-borderWarm rounded-lg text-center bg-canvas" /><span class="text-muted">mins</span></div></div>
        </div>
      </div>

      <div class="flex gap-2 mt-5">
        <button id="saveSettingsBtn" class="flex-1 bg-obsidian text-canvas py-2 rounded-xl text-xs font-semibold active:scale-95 transition-transform">Save</button>
        <button id="closeSettingsBtn" class="flex-1 border border-borderWarm text-muted py-2 rounded-xl text-xs font-semibold active:scale-95 transition-transform">Cancel</button>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-full bg-obsidian text-canvas text-xs font-medium shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 max-w-[90%] text-center z-40"></div>

  <script>
    const HOLD_DURATION = 5000;
    const STORAGE_KEY = 'nudge_tasks_v4';
    const SETTINGS_KEY = 'nudge_intervals_v2';
    const PRESETS = {
      sprint: { values: [15, 30, 45] },
      standard: { values: [30, 60, 120] },
      later: { values: [60, 120, 240] }
    };
    function detectPreset(s1, s2, s3) {
      for (const key in PRESETS) {
        const v = PRESETS[key].values;
        if (v[0] === s1 && v[1] === s2 && v[2] === s3) return key;
      }
      return 'custom';
    }
    let intervals = JSON.parse(localStorage.getItem(SETTINGS_KEY)) || { stage1: 30, stage2: 60, stage3: 120, preset: 'standard' };
    if (!intervals.preset) intervals.preset = detectPreset(intervals.stage1, intervals.stage2, intervals.stage3);
    let audioCtx = null;
    const softNudgeLines = [
      "On your head be it... but are we actually doing this?",
      "Still breathing? Just checking this didn't defeat you.",
      "Friendly nudge, no judgment... okay, maybe a tiny bit.",
      "You said you'd do it. Future you is waiting.",
      "Task calling your name... again. Don't leave it hanging.",
      "Quick reality check: is this done or are we pretending?",
      "We can do this the easy way or the 10th-nudge way.",
      "Just a gentle poke. You've got this.",
      "Procrastination looks good on you, but finishing looks better.",
      "Zero pressure, pure belief. Let's wrap it up."
    ];
    const victoryLines = [
      "Sworn done! Lock it in. You absolute legend.",
      "Look at you actually doing what you said. Iconic.",
      "Boom! Smashed it. On to the next.",
      "Legitimately done. Dopamine earned.",
      "Crossed off and official. Victory lap time."
    ];
    function hashToIndex(str, mod) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) { hash = (hash * 31 + str.charCodeAt(i)) >>> 0; }
      return hash % mod;
    }

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function playTone(freq, type = 'sine', duration = 0.15) {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }
    function playSuccessChime() {
      setTimeout(() => playTone(523.25, 'triangle', 0.12), 0);
      setTimeout(() => playTone(659.25, 'triangle', 0.15), 100);
      setTimeout(() => playTone(783.99, 'triangle', 0.25), 200);
    }
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg; toast.classList.remove('opacity-0'); toast.classList.add('opacity-100');
      setTimeout(() => { toast.classList.remove('opacity-100'); toast.classList.add('opacity-0'); }, 3500);
    }
    function getTasks() { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    function saveTasks(tasks) { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); render(); }
    function setDueInput(dateObj) {
      const copy = new Date(dateObj);
      copy.setMinutes(copy.getMinutes() - copy.getTimezoneOffset());
      document.getElementById('dueDateTime').value = copy.toISOString().slice(0, 16);
    }
    function setDefaultDueInput() {
      const d = new Date(); d.setHours(d.getHours() + 1); d.setMinutes(0); d.setSeconds(0); d.setMilliseconds(0);
      setDueInput(d);
    }
    setDefaultDueInput();

    function parseSpokenIntent(text) {
      let cleaned = text.trim().replace(/^(remind me to|nudge me to|remember to|set a reminder to)\s+/i, '');
      let targetDate = new Date(); let detectedTime = false;
      const inMins = cleaned.match(/\bin\s+(\d+)\s+(minute|minutes|mins|min)\b/i);
      const inHours = cleaned.match(/\bin\s+(\d+)\s+(hour|hours|hrs|hr)\b/i);
      if (inMins) {
        targetDate = new Date(Date.now() + parseInt(inMins[1], 10) * 60000);
        cleaned = cleaned.replace(inMins[0], '').trim(); detectedTime = true;
      } else if (inHours) {
        targetDate = new Date(Date.now() + parseInt(inHours[1], 10) * 3600000);
        cleaned = cleaned.replace(inHours[0], '').trim(); detectedTime = true;
      }
      const atTime = cleaned.match(/\bat\s+(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/i);
      if (atTime) {
        let h = parseInt(atTime[1], 10); const m = atTime[2] ? parseInt(atTime[2], 10) : 0;
        const meridian = atTime[3]?.toLowerCase();
        if (meridian === 'pm' && h < 12) h += 12;
        if (meridian === 'am' && h === 12) h = 0;
        targetDate.setHours(h, m, 0, 0);
        if (targetDate.getTime() <= Date.now()) targetDate.setDate(targetDate.getDate() + 1);
        cleaned = cleaned.replace(atTime[0], '').trim(); detectedTime = true;
      }
      return { taskText: cleaned.charAt(0).toUpperCase() + cleaned.slice(1), targetDate: detectedTime ? targetDate : null };
    }

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = SpeechRec ? new SpeechRec() : null;
    if (recognition) {
      recognition.continuous = false; recognition.lang = 'en-GB';
      recognition.onresult = (e) => {
        const parsed = parseSpokenIntent(e.results[0][0].transcript);
        document.getElementById('taskInput').value = parsed.taskText;
        if (parsed.targetDate) { setDueInput(parsed.targetDate); showToast(`Parsed: Due ${formatTimeLabel(parsed.targetDate.getTime())}`); }
        document.getElementById('micBtn').classList.remove('bg-accentLilacSoft', 'text-accentLilacDeep');
      };
      recognition.onerror = () => document.getElementById('micBtn').classList.remove('bg-accentLilacSoft', 'text-accentLilacDeep');
      recognition.onend = () => document.getElementById('micBtn').classList.remove('bg-accentLilacSoft', 'text-accentLilacDeep');
    }

    document.getElementById('micBtn').addEventListener('click', () => {
      initAudio();
      if (!recognition) return showToast('Dictation not supported in this browser.');
      recognition.start();
      document.getElementById('micBtn').classList.add('bg-accentLilacSoft', 'text-accentLilacDeep');
      showToast('Say: "Clean room in 45 mins"');
    });

    document.getElementById('addBtn').addEventListener('click', () => {
      initAudio();
      const input = document.getElementById('taskInput');
      const text = input.value.trim();
      const dueVal = document.getElementById('dueDateTime').value;
      const earlyMins = parseInt(document.getElementById('earlyAlert').value, 10);
      if (!text || !dueVal) return;
      const tasks = getTasks();
      if (tasks.length >= 5) return showToast('Limit reached: 5 tasks max.');
      const dueTimestamp = new Date(dueVal).getTime();
      tasks.push({ id: 't_' + Date.now(), text, dueTime: dueTimestamp, targetTime: dueTimestamp - (earlyMins * 60000), earlyMins, status: 'active', stage: 0 });
      input.value = ''; setDefaultDueInput(); saveTasks(tasks); showToast('Task set. Watching you.');
    });

    const settingsModal = document.getElementById('settingsModal');
    const customPanel = document.getElementById('customPanel');
    const customChevron = document.getElementById('customChevron');
    let customOpen = false;

    function highlightPreset(key) {
      document.querySelectorAll('.preset-pill').forEach((p) => {
        const active = p.dataset.preset === key;
        p.classList.toggle('bg-accentLilacSoft', active);
        p.classList.toggle('border-accentLilacDeep', active);
        p.classList.toggle('text-accentLilacDeep', active);
        p.classList.toggle('bg-canvas', !active);
        p.classList.toggle('border-borderWarm', !active);
        p.classList.toggle('text-obsidian', !active);
        const icon = p.querySelector('.preset-icon');
        if (icon) icon.setAttribute('stroke', active ? '#7371FC' : '#111215');
      });
    }
    function setCustomPanelOpen(isOpen) {
      customOpen = isOpen;
      customPanel.style.maxHeight = isOpen ? customPanel.scrollHeight + 'px' : '0px';
      customPanel.style.opacity = isOpen ? '1' : '0';
      customChevron.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
    }
    function applyPresetValues(values) {
      document.getElementById('settingStage1').value = values[0];
      document.getElementById('settingStage2').value = values[1];
      document.getElementById('settingStage3').value = values[2];
    }

    document.querySelectorAll('.preset-pill').forEach((pill) => {
      pill.addEventListener('click', () => {
        initAudio(); playTone(520, 'sine', 0.06);
        try { navigator.vibrate && navigator.vibrate(8); } catch (e) {}
        const key = pill.dataset.preset;
        applyPresetValues(PRESETS[key].values);
        highlightPreset(key);
        setCustomPanelOpen(false);
      });
    });
    ['settingStage1', 'settingStage2', 'settingStage3'].forEach((id) => {
      document.getElementById(id).addEventListener('input', () => highlightPreset(null));
    });
    document.getElementById('customToggleBtn').addEventListener('click', () => {
      initAudio(); playTone(420, 'sine', 0.05);
      setCustomPanelOpen(!customOpen);
    });

    document.getElementById('settingsBtn').addEventListener('click', () => {
      document.getElementById('settingStage1').value = intervals.stage1;
      document.getElementById('settingStage2').value = intervals.stage2;
      document.getElementById('settingStage3').value = intervals.stage3;
      highlightPreset(intervals.preset);
      setCustomPanelOpen(intervals.preset === 'custom');
      settingsModal.classList.remove('opacity-0', 'pointer-events-none');
    });
    document.getElementById('closeSettingsBtn').addEventListener('click', () => settingsModal.classList.add('opacity-0', 'pointer-events-none'));
    document.getElementById('saveSettingsBtn').addEventListener('click', () => {
      intervals.stage1 = Math.max(1, parseInt(document.getElementById('settingStage1').value, 10) || 30);
      intervals.stage2 = Math.max(1, parseInt(document.getElementById('settingStage2').value, 10) || 60);
      intervals.stage3 = Math.max(1, parseInt(document.getElementById('settingStage3').value, 10) || 120);
      intervals.preset = detectPreset(intervals.stage1, intervals.stage2, intervals.stage3);
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(intervals));
      settingsModal.classList.add('opacity-0', 'pointer-events-none');
      showToast('Nudge intervals updated.');
    });

    function formatTimeLabel(epoch) {
      const d = new Date(epoch);
      return (new Date().toDateString() === d.toDateString()) ? `Today at ${d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}` : `${d.toLocaleDateString([], { month: 'short', day: 'numeric' })} at ${d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
    }

    function render() {
      const tasks = getTasks();
      const listEl = document.getElementById('taskList');
      document.getElementById('taskCount').innerText = `${tasks.length}/5 ACTIVE`;
      listEl.innerHTML = tasks.length === 0 ? '<div class="p-8 text-center border border-dashed border-borderWarm rounded-card"><p class="font-mono text-xs text-muted">Zero tasks pending. You are completely clear.</p></div>' : '';

      tasks.forEach((task) => {
        const now = Date.now();
        const isPastDue = now >= task.targetTime;
        let badge = 'Pending', badgeColor = 'bg-borderWarm/40 text-muted';
        let subtitle = `Due ${formatTimeLabel(task.dueTime)}`;
        if (task.status === 'soft_done') {
          badge = `Nudge Check ${task.stage}/3`;
          badgeColor = 'bg-accentLilacSoft text-accentLilacDeep font-bold';
          subtitle = isPastDue ? softNudgeLines[hashToIndex(task.id + ':' + task.stage, softNudgeLines.length)] : `Checking back in ${Math.max(0, Math.ceil((task.targetTime - now) / 60000))}m`;
        } else if (isPastDue) {
          badge = 'Due Now'; badgeColor = 'bg-obsidian text-canvas animate-pulse';
          subtitle = softNudgeLines[hashToIndex(task.id + ':0', softNudgeLines.length)];
        } else if (task.earlyMins > 0) {
          subtitle = `Due ${formatTimeLabel(task.dueTime)} (${task.earlyMins}m alert)`;
        }

        const card = document.createElement('div');
        card.className = 'bg-cardBg border border-borderWarm rounded-card p-4 shadow-sm flex items-center justify-between gap-3';
        card.innerHTML = `
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-1">
              <span class="font-mono text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded ${badgeColor}">${badge}</span>
              ${task.status === 'soft_done' ? `<button onclick="resetTask('${task.id}')" class="font-mono text-[10px] text-muted hover:text-obsidian underline">Reset Check</button>` : ''}
            </div>
            <p class="font-semibold text-obsidian text-sm leading-snug break-words">${task.text}</p>
            <p class="font-mono text-[11px] text-muted mt-0.5">${subtitle}</p>
          </div>
          <div class="relative flex items-center justify-center flex-shrink-0 w-16 h-16">
            <svg class="w-16 h-16 transform -rotate-90 pointer-events-none" viewBox="0 0 64 64">
              <circle class="ring-track" cx="32" cy="32" r="28" stroke-width="4" fill="none" />
              <circle id="ring-${task.id}" class="ring-progress" cx="32" cy="32" r="28" stroke-width="4" stroke-dasharray="175.92" stroke-dashoffset="175.92" stroke-linecap="round" fill="none" />
            </svg>
            <button id="btn-${task.id}" class="absolute inset-2 bg-canvas hover:bg-borderWarm/30 border border-borderWarm rounded-full flex flex-col items-center justify-center text-[10px] font-bold tracking-tight text-obsidian active:scale-95 transition-transform">
              <span>DONE</span><span class="text-[8px] font-mono text-muted font-normal">HOLD 5s</span>
            </button>
          </div>
        `;
        listEl.appendChild(card);
        bindButton(task);
      });
    }

    window.resetTask = function(taskId) {
      const tasks = getTasks(); const task = tasks.find(t => t.id === taskId);
      if (!task) return;
      task.status = 'active'; task.stage = 0; task.targetTime = task.dueTime;
      saveTasks(tasks); showToast('Accident undone. Task reset.');
    };

    function bindButton(task) {
      const btn = document.getElementById(`btn-${task.id}`);
      const ring = document.getElementById(`ring-${task.id}`);
      let holdStart = 0, holdTimer = null, completed = false;

      function startHold(e) {
        e.preventDefault(); initAudio(); completed = false; holdStart = Date.now();
        btn.parentElement.classList.add('active-hold');
        holdTimer = setInterval(() => {
          const elapsed = Date.now() - holdStart;
          const progress = Math.min(elapsed / HOLD_DURATION, 1);
          ring.style.strokeDashoffset = 175.92 - (progress * 175.92);
          if (elapsed % 1000 < 50) playTone(300 + (progress * 400), 'sine', 0.05);
          if (progress >= 1) {
            clearInterval(holdTimer); completed = true;
            btn.parentElement.classList.add('burst');
            try { navigator.vibrate && navigator.vibrate([30, 40, 80]); } catch (e) {}
            setTimeout(() => triggerHard(task.id), 350);
          }
        }, 30);
      }
      function cancelHold() {
        if (completed) return;
        clearInterval(holdTimer);
        btn.parentElement.classList.remove('active-hold');
        ring.style.strokeDashoffset = 175.92;
        if (Date.now() - holdStart < 800) triggerSoft(task.id);
      }
      btn.addEventListener('touchstart', startHold, { passive: false });
      btn.addEventListener('touchend', cancelHold);
      btn.addEventListener('mousedown', startHold);
      btn.addEventListener('mouseup', cancelHold);
    }

    function triggerSoft(taskId) {
      initAudio(); playTone(440, 'sine', 0.1);
      const tasks = getTasks(); const task = tasks.find(t => t.id === taskId);
      if (!task) return;
      task.status = 'soft_done'; task.stage = (task.stage || 0) + 1;
      let nextMins = intervals.stage1;
      if (task.stage === 2) nextMins = intervals.stage2;
      if (task.stage === 3) nextMins = intervals.stage3;
      if (task.stage > 3) { showToast('Final check passed. Task closed.'); return saveTasks(tasks.filter(t => t.id !== taskId)); }
      task.targetTime = Date.now() + (nextMins * 60000);
      saveTasks(tasks); showToast(`Soft done logged. Nudging in ${nextMins}m.`);
    }

    function triggerHard(taskId) {
      playSuccessChime();
      showToast(victoryLines[Math.floor(Math.random() * victoryLines.length)]);
      saveTasks(getTasks().filter(t => t.id !== taskId));
    }

    setInterval(render, 30000);
    render();
  </script>
</body>
</html>
